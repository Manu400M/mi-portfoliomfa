<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="cad-title cad-desc">
  <title id="cad-title">Reconciliación conceptual de información CAD e IFC</title>
  <desc id="cad-desc">Un conjunto geométrico sintético y representaciones abstractas de propiedades ilustran un recorrido de datos: origen, correspondencia, incidencias y verificación. Las excepciones requieren revisión humana. Ilustración conceptual de datos ficticios, sin reproducir la arquitectura de una aplicación real.</desc>
