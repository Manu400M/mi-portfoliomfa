<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="verification-title verification-desc">
  <title id="verification-title">Contraste de representaciones de un conjunto sintético</title>
  <desc id="verification-desc">Un ensamblaje geométrico inventado se relaciona con cuatro fuentes: modelo CAD, plano, lista de materiales y requisitos. Las comprobaciones pueden confirmar una correspondencia o dejar un punto para revisión. Ilustración conceptual con geometría y datos ficticios, sin información de proyectos.</desc>
